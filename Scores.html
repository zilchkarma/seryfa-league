  html,body{margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg);padding:20px}

  .topbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:6px 0 16px; }

  .filter-bar{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  select{
    padding:8px 12px; background:var(--input-bg); color:var(--input-fg);
    border:1px solid var(--input-border); border-radius:6px; font-size:0.95rem;
  }

   
  table{border-collapse:collapse;width:100%;margin-bottom:30px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--border)}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:center}
  th{background:var(--th-bg);color:var(--th-fg)}
  .date-cell{background:#000;color:#FFD700}
  th.sortable{cursor:pointer;user-select:none}
  th.asc::after{content:" ▲"} th.desc::after{content:" ▼"}

   
  .form-card{
    max-width:700px; margin:28px auto; background:var(--card);
    border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); overflow:hidden;
  }
  .form-card header{ background:var(--th-bg); color:var(--th-fg); padding:12px 16px; font-weight:bold; text-align:center; }
  .form-card .content{ padding:16px; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .grid .full{ grid-column:1 / -1; }
  .grid > * { min-width:0; }
  label{display:block;margin:6px 0 4px 2px;font-size:0.9rem;color:var(--muted)}
  input[type="text"], input[type="date"], input[type="number"], .form-card select{
    width:100%; box-sizing:border-box; padding:10px 12px; background:var(--input-bg); color:var(--input-fg);
    border:1px solid var(--input-border); border-radius:6px; outline:none; transition:border-color .15s;
  }
  input:focus, .form-card select:focus{ border-color:#FFD700; }
  .btn{ display:inline-block; background:#FFD700; color:#000; border:1px solid #e2c200; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; }
  .btn:active{ transform:translateY(1px) }
  .result{ margin-top:10px; font-weight:bold; min-height:1.2em; }

(function(){

  function apply(pref){
    if(pref === 'light' || pref === 'dark'){
      document.documentElement.setAttribute('data-theme', pref);
    }else{
      document.documentElement.removeAttribute('data-theme');
      pref = 'auto';
    }
    try{ localStorage.setItem('theme', pref); }catch(e){}
  }
  try{ sel.value = localStorage.getItem('theme') || 'auto'; }catch(e){ sel.value = 'auto'; }
  sel.addEventListener('change', function(){ apply(this.value); });
})();
</script>

  function getComparator(type, i, asc){
    if(type === 'score') return function(a, b){
      const ab = scoreValue(a.children[i].textContent), bb = scoreValue(b.children[i].textContent);
      const ah = ab[0], aa = ab[1], bh = bb[0], ba = bb[1];
      if(isNaN(ah) && isNaN(bh)) return 0;
      if(isNaN(ah)) return 1;
      if(isNaN(bh)) return -1;
      const gdA = ah - aa, gdB = bh - ba;
      if(gdA !== gdB) return asc ? (gdA - gdB) : (gdB - gdA);
      return asc ? (ah - bh) : (bh - ah);
    };
    if(type === 'date') return function(a, b){
      const ax = getIsoOrParseDate(a.children[i]), bx = getIsoOrParseDate(b.children[i]);
      return asc ? (ax - bx) : (bx - ax);
    };
    return function(a, b){
      const ax = a.children[i].textContent.trim(), bx = b.children[i].textContent.trim();
      const cmp = ax.localeCompare(bx, undefined, {numeric:true, sensitivity:'base'});
      return asc ? cmp : -cmp;
    };
  }
  function attachSorters(root){
    const tables = (root || document).querySelectorAll('table.sortable');
    tables.forEach(function(table){
      const headers = [].slice.call(table.querySelectorAll('thead th.sortable'));
      headers.forEach(function(th, idx){
        th.addEventListener('click', function(){
          const asc = !th.classList.contains('asc');
          headers.forEach(function(h){ h.classList.remove('asc', 'desc'); });
          th.classList.add(asc ? 'asc' : 'desc');
          const cmp = getComparator(th.dataset.type || 'text', idx, asc);
          const tbody = table.tBodies[0];
          const rows = [].slice.call(tbody.querySelectorAll('tr'));
          rows.sort(cmp);
          rows.forEach(function(r){ tbody.appendChild(r); });
        });
      });
    });
  }
  window.__attachScoresSorters = attachSorters;
})();


function formatDMY(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length !== 3) return iso;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

function render(){
  const age = ageSel.value, div = document.getElementById('divFilter').value;
  const container = document.getElementById('scores');
  container.innerHTML = '';

  const ages = age === 'ALL' ? Object.keys(data).sort() : [age];
  let renderedCount = 0;

  ages.forEach(function(a){
    if(!data[a]) return;
    Object.keys(data[a]).sort().forEach(function(division){
      if(div !== 'ALL' && div !== division) return;
      const matches = data[a][division];

      var html = '<h2>' + a + ' - ' + division + '</h2><table class="sortable"><thead><tr>'
        + '<th class="sortable date-cell" data-type="date">Date</th>'
        + '<th class="sortable" data-type="text">Home</th>'
        + '<th class="sortable" data-type="score">Score</th>'
        + '<th class="sortable" data-type="text">Away</th>'
        + '</tr></thead><tbody>';

      matches.forEach(function(m){
        var score = (m.hs !== '' && m.as !== '') ? (m.hs + ' - ' + m.as) : '-';
        html += '<tr>'
          + '<td class="date-cell" data-iso="' + (m.date || '') + '">' + formatDMY(m.date) + '</td>'
          + '<td>' + m.home + '</td>'
          + '<td>' + score + '</td>'
          + '<td>' + m.away + '</td>'
          + '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML += html;
      renderedCount++;
    });
  });

  if(renderedCount === 0){
    container.innerHTML = '<p class="muted" style="margin:20px 0;">No completed matches recorded for this selection.</p>';
  }

  window.__attachScoresSorters(container);
}

ageSel.addEventListener('change', function(){ updateDivFilter(); render(); });
document.getElementById('divFilter').addEventListener('change', render);
updateDivFilter();
render();
</script>

<section id="match-entry">

<script>

(function(){
  var formAgeSel = document.getElementById('ageGroup');
  var formDivSel = document.getElementById('division');
  var homeSel = document.getElementById('home');
  var awaySel = document.getElementById('away');

  function populateAges(){
    formAgeSel.innerHTML = '<option value="">Select Age Group</option>';
    Object.keys(data).sort().forEach(function(age){
      formAgeSel.innerHTML += '<option value="' + age + '">' + age + '</option>';
    });
  }

  function populateDivisions(){
    var age = formAgeSel.value;
    formDivSel.innerHTML = '<option value="">Select Division</option>';
    formDivSel.disabled = !age;
    homeSel.innerHTML = '<option value="">Select Home Team</option>';
    awaySel.innerHTML = '<option value="">Select Away Team</option>';
    homeSel.disabled = true;
    awaySel.disabled = true;

    if(!age || !data[age]) return;
    Object.keys(data[age]).sort().forEach(function(div){
      formDivSel.innerHTML += '<option value="' + div + '">' + div + '</option>';
    });
  }

  function populateTeams(){
    var age = formAgeSel.value, div = formDivSel.value;
    homeSel.innerHTML = '<option value="">Select Home Team</option>';
    awaySel.innerHTML = '<option value="">Select Away Team</option>';
    var enable = !!(age && div && data[age] && data[age][div]);
    homeSel.disabled = !enable;
    awaySel.disabled = !enable;
    if(!enable) return;

    var teamsSet = new Set();
    data[age][div].forEach(function(m){
      if(m.home) teamsSet.add(m.home);
      if(m.away) teamsSet.add(m.away);
    });

    Array.from(teamsSet).sort().forEach(function(t){
      homeSel.innerHTML += '<option value="' + t + '">' + t + '</option>';
      awaySel.innerHTML += '<option value="' + t + '">' + t + '</option>';
    });
  }

  populateAges();
  formAgeSel.addEventListener('change', populateDivisions);
  formDivSel.addEventListener('change', populateTeams);
})();
</script>

<script>

document.getElementById("matchForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("resultMessage");

  btn.disabled = true;
  btn.textContent = "Submitting…";
  msg.textContent = "Submitting…";
  msg.style.color = "var(--muted)";

  const payload = {
    type: "match_submission",
    ageGroup: document.getElementById("ageGroup").value,
    date: document.getElementById("date").value,
    competition: document.getElementById("division").value,
    home: document.getElementById("home").value,
    away: document.getElementById("away").value,
    homeScore: document.getElementById("homeScore").value,
    awayScore: document.getElementById("awayScore").value,
    referee: document.getElementById("referee").value,
    location: document.getElementById("location").value
  };

  const ENDPOINT = "https://script.google.com/macros/s/AKfycbwrg4h41GlQpwbi9hLXRC_OGX4XyW2xaxFxmH0KoL5Xa2fm_TXMEwpxPjsFlUV3LCEv1w/exec";

  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const result = await res.json();
    if(result.status === "success" || result.answer) {
      msg.textContent = "✅ Match submitted successfully.";
      msg.style.color = "#00B050";
      form.reset();
    } else {
      msg.textContent = "⚠️ " + (result.message || result.error || "Submission recorded.");
      msg.style.color = "#C00000";
    }
  } catch (err) {
    msg.textContent = "❌ Connection failed: " + err.message;
    msg.style.color = "#C00000";
  }

  btn.disabled = false;
  btn.textContent = "Submit Match";
});
</script>
