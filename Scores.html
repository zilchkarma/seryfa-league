<script>

(function(){
  var sel = document.getElementById('themeSel');
  function apply(pref){
    if(pref === 'light' || pref === 'dark'){
      document.documentElement.setAttribute('data-theme', pref);
    }else{
      document.documentElement.removeAttribute('data-theme'); 
      pref = 'auto';
    }
    try{ localStorage.setItem('theme', pref); }catch(e){}
  }
  try{
    var saved = localStorage.getItem('theme') || 'auto';
    sel.value = saved;
  }catch(e){ sel.value = 'auto'; }
  sel.addEventListener('change', function(){ apply(this.value); });
})();
</script>

<script>

const data = {};
const ageSel = document.getElementById('ageFilter');
Object.keys(data).forEach(function(age){
  ageSel.innerHTML += '<option value="'+age+'">'+age+'</option>';
});
function updateDivFilter(){
  const divSel=document.getElementById('divFilter');
  divSel.innerHTML='<option value="ALL">All Divisions</option>';
  const age=ageSel.value;
  if(age==='ALL') return;
  Object.keys(data[age]).forEach(function(div){
    divSel.innerHTML += '<option value="'+div+'">'+div+'</option>';
  });
}


(function(){
  function parseDMY(s){
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s||'').trim());
    if(!m) return NaN;
    const d = Number(m[1]), mo = Number(m[2])-1, y = Number(m[3]);
    return new Date(y, mo, d).getTime();
  }
  function getIsoOrParseDate(td){
    const iso = td && td.dataset ? (td.dataset.iso||'') : '';
    if(iso){
      const t = Date.parse(iso);
      return isNaN(t)?NaN:t;
    }
    return parseDMY(td ? td.textContent : '');
  }
  function scoreValue(s){
    const m = /^\s*(\d+)\s*[-–]\s*(\d+)\s*$/.exec(s||'');
    if(!m) return [NaN,NaN];
    return [Number(m[1]),Number(m[2])];
  }
  function getComparator(type,i,asc){
    if(type==='num') return function(a,b){
      const ax = parseFloat(a.children[i].textContent.replace(/[^\d.\-]/g,''))||0;
      const bx = parseFloat(b.children[i].textContent.replace(/[^\d.\-]/g,''))||0;
      return asc?(ax-bx):(bx-ax);
    };
    if(type==='text') return function(a,b){
      const ax=a.children[i].textContent.trim();
      const bx=b.children[i].textContent.trim();
      const cmp=ax.localeCompare(bx,undefined,{numeric:true,sensitivity:'base'});
      return asc?cmp:-cmp;
    };
    if(type==='date') return function(a,b){
      const ax=getIsoOrParseDate(a.children[i]);
      const bx=getIsoOrParseDate(b.children[i]);
      return asc?(ax-bx):(bx-ax);
    };
    if(type==='score') return function(a,b){
      const ab=scoreValue(a.children[i].textContent);
      const bb=scoreValue(b.children[i].textContent);
      const ah=ab[0], aa=ab[1], bh=bb[0], ba=bb[1];
      if(isNaN(ah)&&isNaN(bh))return 0;
      if(isNaN(ah))return 1;
      if(isNaN(bh))return -1;
      const gdA=ah-aa, gdB=bh-ba;
      if(gdA!==gdB)return asc?(gdA-gdB):(gdB-gdA);
      if(ah!==bh)return asc?(ah-bh):(bh-ah);
      return asc?(aa-ba):(ba-aa);
    };
    return function(){return 0;};
  }
  function attachSorters(root){
    const tables=(root||document).querySelectorAll('table.sortable');
    tables.forEach(function(table){
      const headers=[].slice.call(table.querySelectorAll('thead th.sortable'));
      headers.forEach(function(th,idx){
        th.addEventListener('click',function(){
          const asc=!th.classList.contains('asc');
          headers.forEach(function(h){h.classList.remove('asc','desc');});
          th.classList.add(asc?'asc':'desc');
          const cmp=getComparator(th.dataset.type||'text',idx,asc);
          const tbody=table.tBodies[0];
          const rows=[].slice.call(tbody.querySelectorAll('tr'));
          rows.sort(cmp);
          rows.forEach(function(r){tbody.appendChild(r);});
        });
      });
    });
  }
  window.__attachScoresSorters=attachSorters;
})();


function formatDMY(d){
  return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
}
function render(){
  const age=ageSel.value, div=document.getElementById('divFilter').value;
  const container=document.getElementById('scores');
  container.innerHTML='';
  const ages=age==='ALL'?Object.keys(data):[age];
  ages.forEach(function(a){
    Object.entries(data[a]).forEach(function(entry){
      const division=entry[0], matches=entry[1];
      if(div!=='ALL'&&div!==division)return;
      var html='<h2>'+a+' - '+division+'</h2><table class="sortable"><thead><tr>'
        + '<th class="sortable date-cell" data-type="date">Date</th>'
        + '<th class="sortable" data-type="text">Home</th>'
        + '<th class="sortable" data-type="score">Score</th>'
        + '<th class="sortable" data-type="text">Away</th>'
        + '</tr></thead><tbody>';
      matches.forEach(function(m){
        var parts=(m.date||'').split('-').map(Number);
        var d=new Date(parts[0], (parts[1]||1)-1, parts[2]||1);
        var iso=m.date;
        var score=(m.hs!=='' && m.as!=='') ? (m.hs+'-'+m.as) : '';
        html += '<tr><td class="date-cell" data-iso="'+iso+'">'+formatDMY(d)+'</td>'
             + '<td>'+m.home+'</td><td>'+score+'</td><td>'+m.away+'</td></tr>';
      });
      html+='</tbody></table>';
      container.innerHTML+=html;
    });
  });
  window.__attachScoresSorters(container);
}
ageSel.addEventListener('change',function(){updateDivFilter();render();});
document.getElementById('divFilter').addEventListener('change',render);
updateDivFilter();render();
</script>

<hr>
<section id="match-entry">
  <div class="form-card">
    <header>Submit or Update a Match</header>
    <div class="content">
      <form id="matchForm">
        <div class="grid">

          <div class="full">
            <label for="ageGroup">Age Group</label>
            <select id="ageGroup" required>
              <option value="">Select Age Group</option>
            </select>

            <span id="resultMessage" class="result"></span>
          </div>

        </div>
      </form>
    </div>
  </div>
</section>

<script>

(function(){
  var formAgeSel = document.getElementById('ageGroup');
  var formDivSel = document.getElementById('division');
  var homeSel = document.getElementById('home');
  var awaySel = document.getElementById('away');

  function populateAges(){
    formAgeSel.innerHTML = '<option value="">Select Age Group</option>';
    Object.keys(data).sort(function(a,b){
      var na = parseInt(a.replace(/D+/g,''),10), nb = parseInt(b.replace(/D+/g,''),10);
      if(!isNaN(na) && !isNaN(nb)) return na-nb;
      return a.localeCompare(b);
    }).forEach(function(age){
      formAgeSel.innerHTML += '<option value="'+age+'">'+age+'</option>';
    });
  }

  function populateDivisions(){
    var age = formAgeSel.value;
    formDivSel.innerHTML = '<option value="">Select Division</option>';
    formDivSel.disabled = !age;

    homeSel.innerHTML = '<option value="">Select Home Team</option>';
    awaySel.innerHTML = '<option value="">Select Away Team</option>';
    homeSel.disabled = true;
    awaySel.disabled = true;

    if(!age || !data[age]) return;
    Object.keys(data[age]).sort().forEach(function(div){
      formDivSel.innerHTML += '<option value="'+div+'">'+div+'</option>';
    });
  }

  function teamsFor(age, div){
    var set = new Set();
    var matches = (data[age] && data[age][div]) ? data[age][div] : [];
    matches.forEach(function(m){
      if(m.home) set.add(m.home);
      if(m.away) set.add(m.away);
    });
    return Array.from(set).sort(function(a,b){
      return a.localeCompare(b, undefined, {sensitivity:'base'});
    });
  }

  function populateTeams(){
    var age = formAgeSel.value, div = formDivSel.value;
    homeSel.innerHTML = '<option value="">Select Home Team</option>';
    awaySel.innerHTML = '<option value="">Select Away Team</option>';

    var enable = !!(age && div);
    homeSel.disabled = !enable;
    awaySel.disabled = !enable;
    if(!enable) return;

    var teams = teamsFor(age, div);
    teams.forEach(function(t){
      homeSel.innerHTML += '<option value="'+t+'">'+t+'</option>';
      awaySel.innerHTML += '<option value="'+t+'">'+t+'</option>';
    });

    function syncDisables(){
      var h = homeSel.value, a = awaySel.value;
      Array.from(homeSel.options).forEach(opt => opt.disabled = (opt.value && opt.value === a));
      Array.from(awaySel.options).forEach(opt => opt.disabled = (opt.value && opt.value === h));
      if(h && h === a){ awaySel.value = ''; }
    }
    homeSel.addEventListener('change', syncDisables);
    awaySel.addEventListener('change', syncDisables);
  }

  populateAges();
  formAgeSel.addEventListener('change', populateDivisions);
  formDivSel.addEventListener('change', populateTeams);
})();
</script>

<script>

document.getElementById("matchForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = e.target;
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("resultMessage");

  
  btn.disabled = true;
  btn.textContent = "Submitting…";

  msg.textContent = "Submitting…";
  msg.style.color = "#333";

  var body = new URLSearchParams({
    ageGroup: document.getElementById("ageGroup").value,
    date: document.getElementById("date").value,
    competition: document.getElementById("division").value,
    home: document.getElementById("home").value,
    away: document.getElementById("away").value,
    homeScore: document.getElementById("homeScore").value,
    awayScore: document.getElementById("awayScore").value,
    referee: document.getElementById("referee").value,
    location: document.getElementById("location").value
  });

  try {
    var res = await fetch("https://script.google.com/macros/s/AKfycbytk996A8C2OdalIjKAYWFLFyOB9Kp4WRJS8sCXIwvyoLKepHLZyOCf2mPp33h1p29JvA/exec", {
      method: "POST",
      body: body
    });

    var txt = await res.text();
    var result = {};
    try { result = JSON.parse(txt); }
    catch { result = { status: "error", message: txt }; }

    if (result.status === "success") {
      msg.textContent = "✅ Match " + result.action + ": " + result.normalized.home + " vs " + result.normalized.away;
      msg.style.color = "green";
      form.reset();
    } else {
      msg.textContent = "⚠️ Error: " + result.message;
      msg.style.color = "red";
    }
  } catch (err) {
    msg.textContent = "❌ Network or server error: " + err.message;
    msg.style.color = "red";
  }

  
  btn.disabled = false;
  btn.textContent = "Submit Match";
});
</script>
